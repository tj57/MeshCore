name: mcRPC consumer check

on:
  push:
    paths:
      - 'examples/mcrpc/**'
      - 'variants/heltec_v3/platformio.ini'
      - 'variants/rak_wismesh_tag/platformio.ini'
      - 'platformio.ini'
      - '.github/workflows/mcrpc.yml'
  pull_request:
    paths:
      - 'examples/mcrpc/**'
      - 'variants/heltec_v3/platformio.ini'
      - 'variants/rak_wismesh_tag/platformio.ini'
      - 'platformio.ini'
      - '.github/workflows/mcrpc.yml'
  workflow_dispatch:

jobs:
  # CI uses committed [mcrpc_lib] GitHub pin — never platformio.local.ini
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no local override in CI checkout
        run: |
          test ! -f platformio.local.ini
          grep -q 'mcrpc_lib' platformio.ini
          grep -q '\${mcrpc_lib.lib}' variants/heltec_v3/platformio.ini
          grep -q '\${mcrpc_lib.lib}' variants/rak_wismesh_tag/platformio.ini
          echo "Release dependency wiring OK"
      - name: Show pinned mcRPC
        run: grep -A2 '\[mcrpc_lib\]' platformio.ini
